name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # 浏览器用例要 puppeteer-core（根 devDependency）：先装依赖，npm test 里的
      # browser-case 才会真开 Chrome 跑，而不是 skip。其余契约测试仍应保持无依赖也能跑。
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Syntax
        run: node --check index.js && node --check client.src.js

      - name: Repository contract
        run: npm test

      # node --check 查不出「同作用域内先用后声明」（issue #6：空看板第一行崩），
      # 这一步把 web/src 与 client.src.js 都扫一遍。不装依赖也能跑。
      - name: TDZ scan
        run: npm run verify:tdz

      # /studio-api 的信任栅栏：真 handler + 假宿主 + 真 HTTP。
      # 无会话读台账要 401、伪造 Host 要 403、跨站 Origin 要 403、公开提单匿名可用。
      # 没有这一条，「栅栏被谁删掉了」只能等社区列表的披露来提醒。不需要依赖与 token。
      - name: Trust fence
        run: npm run verify:fence

      - name: Build bundle
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Bundle is reproducible
        run: |
          node -e "const c=require('crypto'),f=require('fs');for(const p of ['dist/client.js','client.js']){console.log(p,f.statSync(p).size,c.createHash('sha256').update(f.readFileSync(p)).digest('hex'))}"
          cmp dist/client.js client.js
          git diff --exit-code -- dist/client.js client.js

      # 页面渲染 + 交互节点可访问名称：假宿主 + 真 Chrome，不需要 token。
      # web 依赖与 Chrome 上一步/runner 已就绪；冒烟挂了会直接红，不再只靠本地探针。
      - name: Pages and accessibility probe
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:pages
