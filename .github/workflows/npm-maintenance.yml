# npm 维护任务（手动触发）：deprecate / dist-tag / unpublish。
#
# 为什么要有它：这些操作需要 npm token，而本地机器没有（`npm whoami` → need auth）；
# CI 里已有 NPM_TOKEN secret（release.yml 用它发布），把同样的门禁搬过来即可。
# 只做「人已经决定要做」的一次性维护，不要在 release 流程里自动跑。
name: npm-maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deprecate | dist-tag | unpublish'
        required: true
        default: 'deprecate'
      package:
        description: '包名'
        required: true
        default: '@marsken/dsh-studio'
      version:
        description: '版本（deprecate / unpublish 必填；dist-tag 用 target 指定）'
        required: false
      message:
        description: 'deprecate 的提示语 / dist-tag 的 tag 名（dist-tag 用 target）'
        required: false
      target:
        description: 'dist-tag 要指向的版本'
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: deprecate
        if: ${{ inputs.action == 'deprecate' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate "${{ inputs.package }}@${{ inputs.version }}" "${{ inputs.message }}"
      - name: dist-tag
        if: ${{ inputs.action == 'dist-tag' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "${{ inputs.package }}@${{ inputs.target }}" "${{ inputs.message }}"
      - name: unpublish
        if: ${{ inputs.action == 'unpublish' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm unpublish "${{ inputs.package }}@${{ inputs.version }}" --force
